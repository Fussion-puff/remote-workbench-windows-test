# Remote Workbench SSH MCP Server Configuration
# Copy this to ~/.config/remote-workbench/config.yaml and customize.

# Default host for the multi-host MCP when a tool call omits its host.
default_host: myserver

hosts:
  myserver:
    # SSH hostname or alias (must be reachable via `ssh <ssh_host>`)
    ssh_host: myserver.example.com

    # SSH username (optional — uses system default if omitted)
    user: jdoe

    # SSH port (optional, default: 22)
    # port: 22

    # Path to the SSH ControlMaster socket.
    # Supports SSH tokens: %r (remote user), %h (host), %p (port).
    # Must match what you use when establishing the master connection.
    control_path: "~/.ssh/ctrl-%r@%h:%p"

    # Optional shell commands run before every remote command.
    # Keep empty unless you intentionally need a repeated setup step.
    preamble: ""

    # Default working directory for commands (when cwd is not specified).
    default_cwd: "~/project"

    # Timeout for regular commands in seconds (default: 30).
    command_timeout: 30

    # Timeout for file operations in seconds (default: 60).
    file_timeout: 60

    # Maximum file size in bytes for read/write operations (default: 10MB).
    max_file_size: 10485760

    # Maximum output lines and bytes returned to the MCP client.
    max_output_lines: 200
    max_output_bytes: 16384

  # You can configure multiple hosts:
  # staging:
  #   ssh_host: staging.example.com
  #   user: deploy
  #   control_path: "~/.ssh/ctrl-%r@%h:%p"
  #   default_cwd: "/opt/app"
